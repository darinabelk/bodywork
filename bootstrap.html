<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>BODYWORKS - Регистрация</title>
<link href="css/bootstrap.css" rel="stylesheet" type="text/css">
<link href="css/normalize.css" rel="stylesheet" type="text/css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">
</head>
<body>
	<header class="header">
		<div class="row">
			<div class="col-8">
				<a href="index.html" class="a_logo">
					<img src="img/logo.svg" alt="index.html" class="logo">
				</a>
			</div>
			<div class="col-4">
				<a href="bootstrap.html" class="a_vk">
					<img src="img/vk.svg" alt="" class="sotc" style="padding-left: 25px;">
				</a>
				<a href="bootstrap.html" class="a_tg">
					<img src="img/telegram.svg" alt="" class="sotc" style="padding-left: 40px;">
				</a>
				<a href="bootstrap.html" class="a_yt">
					<img src="img/youtube.svg" alt="" class="sotc" style="padding-left: 40px;">
				</a>
			</div>
		</div>
	</header>
	<div class="content">
		<h3 class="h1">РЕГИСТРАЦИЯ</h3>
		<div class="con">
			<div class="border123">
				<div class="form-floating mb-3">
					<input type="email" class="form-control" placeholder="ФИО полностью">
					<label class="label123">ФИО</label>
				</div>
				<div class="form-floating mb-3">
					<input type="email" class="form-control" placeholder="name@example.com">
					<label>Электронная почта</label>
				</div>
				<div class="form-floating mb-3">
					<input type="email" class="form-control" placeholder="+799********">
					<label>Номер телефона</label>
				</div>
				<div class="con_but">
					<button class="but" id="openBtn">Зарегистрироваться</button>
				</div>
			</div>
		</div>
	</div>
	<dialog class="uspech" id="modal1">
		<div class="con_usp">
			<img src="img/Group1.png" alt="" class="foto_logo">
			<div class="bord_modal">
				<p class="t1">
					Вы успешно зарегистрировались!
				</p>
				<p class="t2">
					Скоро с Вами свяжется администратор
				</p>
			</div>
			<button class="close2" id="cancelbtn1">X</button>
		</div>
	</dialog>
	<footer class="footer123">
		<div class="footer2">
			<a class="footer3" style="font-size: 24px; margin-top: 16px" href="bootstrap.html">©️ BODYWORKS</a>
			<a class="footer3" style="margin-top: 11px" href="bootstrap.html">Документы</a>
			<a class="footer3" style="margin-top: 11px" href="bootstrap.html">Правила возврата</a>
			<a class="footer3" style="margin-top: 11px" href="bootstrap.html">Политика конфиденциальности</a>
		</div>
	</footer>
	<script>
		openBtn.addEventListener('click', () => {
			modal1.showModal()
	})
		cancelbtn1.addEventListener('click', () => {
			modal1.close()
	})
	</script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4" crossorigin="anonymous"></script>
</body>
</html>
